name: Rust and web checks
on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - run: npm ci
      - run: cargo fmt --manifest-path backend/Cargo.toml --check
      - run: cargo clippy --manifest-path backend/Cargo.toml --all-targets -- -D warnings
      - run: npm run test:engine
      - run: git diff --exit-code -- lib/generated
      - run: npm run typecheck
      - run: npm test
      - name: Verify two-player and six-player API flows
        shell: bash
        run: |
          cargo run --manifest-path backend/Cargo.toml > "$RUNNER_TEMP/slay-server.log" 2>&1 &
          slay_pid=$!
          trap 'kill "$slay_pid" || true' EXIT
          for attempt in {1..100}; do
            if curl --fail --silent http://127.0.0.1:8080/api/health > /dev/null; then break; fi
            sleep 0.2
          done
          npm run test:api
